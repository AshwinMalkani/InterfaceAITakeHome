name: ci

on:
  # Every PR action: opened, updated (new commits), reopened.
  pull_request:
    types: [opened, synchronize, reopened]
  # Post-merge check on main. Branch pushes are covered by their PR, so they don't run twice.
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: make setup
      - run: make check
