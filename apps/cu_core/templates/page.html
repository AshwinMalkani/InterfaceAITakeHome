<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<html>
<head>
<title>{{ t.product_version }}</title>
<style>
  body { font-family: Verdana, Arial, sans-serif; font-size: 11px; background: #efece2; margin: 6px; }
  .hdr { background: {{ t.header_color }}; color: #fff; font-weight: bold; padding: 3px 6px; font-size: 12px; }
  .lbl { text-align: right; color: #333; white-space: nowrap; }
  .grid td { border: 1px solid #aaa; padding: 2px 6px; background: #fff; }
  .grid tr.th td { background: #d6d2c4; font-weight: bold; }
  .num { text-align: right; font-family: "Courier New", monospace; }
  .err { color: #b00000; font-weight: bold; }
  .msg { color: #1f3b73; font-weight: bold; }
  #ovl { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.45); }
  #ovl .box { background: #fff; width: 340px; margin: 80px auto; border: 2px solid #b00000; padding: 10px; }
</style>
</head>
<body>
{% block body %}{% endblock %}
{% if overlay %}
<div id="ovl"><div class="box">
  <div class="hdr" style="background:#b00000">COMPLIANCE HOLD</div>
  <p>This record is subject to a compliance review. Supervisor override is required before continuing.</p>
  <input type="button" value="Override" onclick="document.getElementById('ovl').style.display='none'">
  <input type="button" value="Cancel" onclick="history.back()">
</div></div>
{% endif %}
</body>
</html>
